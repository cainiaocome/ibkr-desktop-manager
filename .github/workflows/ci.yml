name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore IbkrDesktopManager.sln

      - name: Format check
        run: dotnet format IbkrDesktopManager.sln --verify-no-changes --verbosity minimal

      - name: Build (warnings are errors)
        run: dotnet build IbkrDesktopManager.sln -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test IbkrDesktopManager.sln -c Release --no-build
          --logger "trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Interactive keyboard tests (needs a desktop session)
        if: matrix.os == 'windows-latest' && vars.IBKR_INTERACTIVE_SESSION == 'true'
        run: >
          dotnet test tests/IbkrManager.IntegrationTests/IbkrManager.IntegrationTests.csproj
          -c Release --no-build --filter "Category=InteractiveDesktop"
          --logger "trx" --results-directory TestResults/interactive

      - name: Note uncovered keyboard injection
        if: matrix.os == 'windows-latest' && vars.IBKR_INTERACTIVE_SESSION != 'true'
        shell: pwsh
        run: |
          Write-Host "::notice title=Keyboard injection not covered::Hosted Windows runners are service sessions with no input desktop, so SendInput keystrokes are dropped. Everything else (registry discovery, launch/attach, window classification, graceful close, process-tree kill) is covered by the integration suite. To cover typing, run 'dotnet test -c Release --filter Category=InteractiveDesktop' on a console/RDP session or a self-hosted interactive runner."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          retention-days: 7

      - name: Upload headless UI screenshots
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: '**/screenshots/*.png'
          if-no-files-found: ignore
          retention-days: 7

  publish-check:
    name: publish win-x64 (smoke)
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish single-file executable
        run: >
          dotnet publish src/IbkrManager.App/IbkrManager.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -o artifacts/publish

      - name: Verify the executable exists
        shell: pwsh
        run: |
          $exe = Get-Item artifacts/publish/IbkrDesktopManager.exe
          if ($exe.Length -lt 10MB) { throw "Executable looks too small: $($exe.Length) bytes" }

      - uses: actions/upload-artifact@v7
        with:
          name: win-x64-smoke
          path: artifacts/publish
          retention-days: 3
